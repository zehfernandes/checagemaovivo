# Deploys to Fly.io on every push to main (or by hand via "Run workflow").
# Needs the repo secret FLY_API_TOKEN: `fly tokens create deploy -a debate-fact-check -x 8760h`
name: Fly Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only -a debate-fact-check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
